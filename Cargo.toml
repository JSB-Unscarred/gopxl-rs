[package]
name = "gopxl"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Unofficial Rust client for LMI GoPxL (Gocator) sensors, implementing the wire protocol directly."
repository = "https://github.com/JSB-Unscarred/gopxl-rs"
publish = false

[dependencies]
bytes = "1.11"
# link-local：Windows 上默认过滤 169.254.x.x 的网卡，直连设备、没有 DHCP 时就发不出 Discover。
if-addrs = { version = "0.15.0", features = ["link-local"] }
regex-lite = "0.1.9"
# Value 实现 Serialize / Deserialize，&Value 实现 Deserializer：载荷按需反序列化成调用方自己的类型。
serde = "1.0.228"
# float_roundtrip：JSON 文本中的浮点数正确舍入，与 GoJson 用的 strtod 逐位相同。
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
socket2 = "0.6.5"
thiserror = "2.0.18"
# 连接层基于 tokio：每条连接一个读任务，超时与取消统一经 tokio::time；不保留阻塞 API。
tokio = { version = "1.53.3", features = ["rt", "net", "time", "sync", "io-util", "macros"] }

[dev-dependencies]
# derive：文档与测试里类型化读取的示例结构体。
serde = { version = "1.0.228", features = ["derive"] }
# 示例的 #[tokio::main] 与 receive_async 读 stdin。
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-std"] }

[lints.rust]
# 线上协议全部用安全 Rust 实现，unsafe 只出现在依赖中。
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# 错误语义统一记录在 docs::architecture，逐函数复制 `# Errors` 只会制造模板文档。
missing_errors_doc = "allow"
must_use_candidate = "allow"
