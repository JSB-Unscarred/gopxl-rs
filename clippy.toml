# 产品名与协议名几乎出现在每段文档里，按标识符加反引号只会让文档难读；".." 保留 clippy 的默认列表。
doc-valid-idents = ["GoPxL", "GoApi", "MessagePack", ".."]
# 编解码文件用 #![deny] 禁止 unwrap / 下标 / panic，保证坏帧不 panic；测试代码不受此约束。
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
